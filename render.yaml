services:
  - type: web
    name: nature360-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm --prefix server ci
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nature360
      - key: FIREBASE_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OFFICER_EMAILS
        sync: false
      - key: VOLUNTEER_EMAILS
        sync: false
